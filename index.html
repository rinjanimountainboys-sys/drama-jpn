<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaAsia - Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Container Hero Utama */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            overflow: hidden;
        }

        /* Layer Gambar Background dengan Fading Gelap di Sisi Kiri */
        .bg-layer {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://via.placeholder.com/1920x1080?text=Upload+Foto+Di+Sini');
            background-size: cover;
            background-position: center right;
            z-index: 1;
        }

        /* Gradient Overlay: Hitam pekat di kiri, memudar transparan ke kanan */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right, 
                #000000 0%, 
                #000000 40%, 
                rgba(0, 0, 0, 0.75) 55%, 
                rgba(0, 0, 0, 0.2) 75%, 
                transparent 100%
            );
            z-index: 2;
        }

        /* Header Navigation */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #1d72b8;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: #f37021; /* Aksen warna oranye */
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }

        .btn-masuk {
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            padding: 10px 22px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        /* Content Utam/Text Box */
        .content-body {
            position: relative;
            z-index: 10;
            max-width: 650px;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* Banner Teks Putih dengan Transparansi Lembut */
        .text-card {
            background: rgba(255, 255, 255, 0.88);
            color: #000;
            padding: 22px 28px;
            border-radius: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 34px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.5px;
            margin-bottom: 35px;
            display: inline-block;
        }

        .btn-berlangganan {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Footer Scroll Indicator */
        .hero-footer {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .scroll-pill {
            width: 18px;
            height: 30px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            position: relative;
        }

        .scroll-pill::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Widget Pengunggah Foto (Pojok Kanan Bawah) */
        .upload-panel {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .upload-panel label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .upload-panel input[type="file"] {
            font-size: 12px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="bg-layer" id="bgLayer"></div>
        <div class="bg-overlay"></div>

        <header>
            <div class="brand-logo">Drama<span>Asia</span></div>
            <div class="nav-right">
                <a href="#" class="nav-link">Mengeksplorasi</a>
                <a href="#" class="btn-masuk">Masuk</a>
            </div>
        </header>

        <div class="content-body">
            <div class="text-card">
                Konten eksklusif, premium.<br>
                Karya orisinal dan banyak lagi!<br>
                Hiburan Asia terbaik.
            </div>
            <div>
                <a href="#" class="btn-berlangganan">Berlangganan Sekarang</a>
            </div>
        </div>

        <div class="hero-footer">
            <div class="scroll-pill"></div>
            <span>Gulir ke bawah</span>
        </div>
    </div>

    <div class="upload-panel">
        <label for="uploader">Upload Foto Background:</label>
        <input type="file" id="uploader" accept="image/*">
    </div>

    <script>
        // Script untuk langsung menerapkan foto yang di-upload ke background
        const uploader = document.getElementById('uploader');
        const bgLayer = document.getElementById('bgLayer');

        uploader.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    bgLayer.style.backgroundImage = `url('${e.target.result}')`;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
